    <path d="M 256 190 C 276 226, 306 250, 306 290 C 306 324, 282 346, 256 346 C 230 346, 206 324, 206 290 C 206 260, 230 236, 256 190 Z" fill="#FACC15"/>
    <path d="M 256 250 C 266 270, 282 284, 282 306 C 282 324, 270 336, 256 336 C 242 336, 230 324, 230 306 C 230 288, 244 274, 256 250 Z" fill="#F97316"/>
